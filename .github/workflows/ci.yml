name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install swift-format
        run: brew install swift-format

      - name: Lint (swift-format)
        run: make lint

      - name: Build (debug)
        run: make build

      - name: Build app bundle (release)
        run: make app
