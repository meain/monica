name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Lint (swift-format)
        run: nix develop --command make lint

      - name: Build (debug)
        run: make build

      - name: Build app bundle (release)
        run: make app
