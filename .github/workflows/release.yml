name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # actions/checkout's default shallow fetch grabs the tagged commit but
      # not the annotated tag object itself, so `gh release create
      # --notes-from-tag` silently falls back to the commit message instead
      # of the tag's own notes. Force-fetch the tag ref so the annotation is
      # actually present locally.
      - name: Fetch tag annotation
        run: git fetch origin "refs/tags/${{ github.ref_name }}" --force

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app bundle (release)
        run: make app

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent monica.app monica.app.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" monica.app.zip --notes-from-tag
